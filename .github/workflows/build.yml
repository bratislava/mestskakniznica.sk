name: Build with bratiska-cli
on:
  pull_request:
    branches:
      - master
jobs:
  conditions:
    name: Check for build conditions
    uses: bratislava/github-actions/.github/workflows/build-conditions.yml@v2.4.0
    permissions: write-all

  strapi:
    name: build Strapi
    needs: conditions
    if: needs.conditions.outputs.strapi == 'true'
    uses: bratislava/github-actions/.github/workflows/build-with-bratiska-cli.yml@v2.4.0
    with:
      directory: strapi/
      debug: --debug
    permissions: write-all

  next:
    name: build Next
    needs: conditions
    if: needs.conditions.outputs.next == 'true'
    uses: bratislava/github-actions/.github/workflows/build-with-bratiska-cli.yml@v2.4.0
    with:
      directory: next/
      debug: --debug
    permissions: write-all


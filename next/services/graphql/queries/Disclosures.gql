### Fragments

fragment DisclosureEntity on Disclosure {
  documentId
  __typename
  slug
  title
  description
  addedAt
  type
  file {
    ...UploadFileEntity
  }
  dateFrom
  dateTo
  idNumber
  amount
  contractor
  grantProvider
  grantYear
}

### Queries

query DisclosureBySlug($slug: String!) {
  disclosures(filters: { slug: { eq: $slug } }) {
    ...DisclosureEntity
  }
}

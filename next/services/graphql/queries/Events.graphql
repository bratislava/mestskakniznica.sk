fragment EventCardEntity on Event {
  documentId
  __typename
  slug
  title
  description
  createdAt
  updatedAt
  publishedAt
  locale
  dateFrom
  dateTo
  price
  eventCategory {
    documentId
    ...EventCategory
  }
  branch {
    ...EventBranchPlaceEntity
  }
  eventTags {
    documentId
    ...EventTags
  }
  listingImage {
    ...UploadImageEntity
  }
  coverImage {
    ...UploadImageEntity
  }
}


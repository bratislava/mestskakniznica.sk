fragment PageSections on PageSectionsDynamicZone {
  __typename
  ... on ComponentSectionsFaq {
    ...FaqSection
  }
  ... on ComponentSectionsFlatText {
    ...FlatTextSection
  }
  ... on ComponentSectionsSiteUsefullness {
    ...SiteUsefulnessSection
  }
  ... on ComponentSectionsForm {
    ...FormSection
  }
  ... on ComponentSectionsSubpages {
    id
    ...SubpagesSection
  }
  ... on ComponentSectionsTable {
    ...TableSection
  }
  ... on ComponentSectionsAccordion {
    ...AccordionSection
  }
  ... on ComponentSectionsDivider {
    id
  }
  ... on ComponentSectionsCta {
    ...CtaSection
  }

  ... on ComponentSectionsVideo {
    ...VideoSection
  }

  ... on ComponentSectionsAssets {
    id
    ...AssetsSection
  }

  ... on ComponentSectionsMap {
    ...MapSection
  }

  ... on ComponentSectionsRental {
    ...RentalSection
  }

  ... on ComponentSectionsGallery {
    ...GallerySection
  }

  ... on ComponentSectionsOpeningHoursSection {
    ...OpeningHoursSection
  }

  ... on ComponentSectionsChildrenListing {
    ...ChildrenListingSection
  }

  ... on ComponentSectionsCherrypickSection {
    ...CherrypickSection
  }
}

fragment PageEntity on Page {
  __typename
  documentId
  slug
  title
  createdAt
  updatedAt
  publishedAt
  listingImage {
    name
    width
    height
    url
    createdAt
    hash
    mime
    provider
    size
    alternativeText
    updatedAt
  }
  layout
  perex
  sections {
    ...PageSections
  }

  locale
  localizations {
    ...PageLocalizationEntity
  }
  seo {
    ...Seo
  }
}

fragment PageWithBaseFieldsEntity on Page {
  __typename
  documentId
  title
  slug
  createdAt
  updatedAt
}

fragment PageLocalizationEntity on Page {
  __typename
  documentId
  slug
  locale
}

fragment ChildPage on Page {
  title
  slug
}

fragment PageSlugEntity on Page {
  __typename
  documentId
  title
  slug
}

# Fetches 5 levels of the page tree, keep in sync with MAX_LEVELS in strapi/src/api/page/content-types/page/lifecycles.ts.
fragment PageEntityChildPages on Page {
  __typename
  documentId
  ...ChildPage
  childPages {
    __typename
    documentId
    ...ChildPage
    childPages {
      __typename
      documentId
      ...ChildPage
      childPages {
        __typename
        documentId
        ...ChildPage
        childPages {
          __typename
          documentId
          ...ChildPage
        }
      }
    }
  }
}

query PageBySlug($slug: String!, $locale: I18NLocaleCode!) {
  pages(filters: { slug: { eq: $slug } }, locale: $locale) {
    ...PageEntity
  }
}

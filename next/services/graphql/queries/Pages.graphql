fragment PageSections on PageSectionsDynamicZone {
  __typename
  ... on ComponentSectionsFaq {
    ...FaqSection
  }
  ... on ComponentSectionsFlatText {
    ...FlatTextSection
  }
  ... on ComponentSectionsSiteUsefullness {
    ...SiteUsefulnessSection
  }
  ... on ComponentSectionsForm {
    ...FormSection
  }
  ... on ComponentSectionsSubpages {
    id
    ...SubpagesSection
  }
  ... on ComponentSectionsTable {
    ...TableSection
  }
  ... on ComponentSectionsAccordion {
    ...AccordionSection
  }
  ... on ComponentSectionsDivider {
    id
  }
  ... on ComponentSectionsCta {
    ...CtaSection
  }

  ... on ComponentSectionsVideo {
    ...VideoSection
  }

  ... on ComponentSectionsAssets {
    id
    ...AssetsSection
  }

  ... on ComponentSectionsMap {
    ...MapSection
  }

  ... on ComponentSectionsRental {
    ...RentalSection
  }

  ... on ComponentSectionsGallery {
    ...GallerySection
  }

  ... on ComponentSectionsOpeningHoursSection {
    ...OpeningHoursSection
  }

  ... on ComponentSectionsChildrenListing {
    ...ChildrenListingSection
  }

  ... on ComponentSectionsCherrypickSection {
    ...CherrypickSection
  }
}

fragment PageEntity on PageEntity {
  __typename
  id
  attributes {
    slug
    title
    createdAt
    updatedAt
    publishedAt
    listingImage {
      data {
        attributes {
          name
          width
          height
          url
          createdAt
          hash
          mime
          provider
          size
          alternativeText
          updatedAt
        }
      }
    }
    layout
    perex
    sections {
      ...PageSections
    }

    locale
    localizations {
      data {
        ...PageLocalizationEntity
      }
    }
    seo {
      ...Seo
    }
  }
}

fragment PageWithBaseFieldsEntity on PageEntity {
  __typename
  id
  attributes {
    title
    slug
    newSlug
    createdAt
    updatedAt
  }
}

fragment PageLocalizationEntity on PageEntity {
  __typename
  id
  attributes {
    slug
    newSlug
    locale
  }
}

fragment ChildPage on Page {
  title
  newSlug
}

fragment PageSlugEntity on PageEntity {
  __typename
  id
  attributes {
    title
    newSlug
  }
}

fragment PageEntityChildPages on PageEntity {
  __typename
  id
  attributes {
    ...ChildPage
    childPages {
      data {
        __typename
        id
        attributes {
          ...ChildPage
          childPages {
            data {
              __typename
              id
              attributes {
                ...ChildPage
                childPages {
                  data {
                    __typename
                    id
                    attributes {
                      ...ChildPage
                      childPages {
                        data {
                          __typename
                          id
                          attributes {
                            ...ChildPage
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

query PageBySlug($slug: String!, $locale: I18NLocaleCode!) {
  pages(filters: { newSlug: { eq: $slug } }, locale: $locale) {
    data {
      ...PageEntity
    }
  }
}

query SortedPartners($locale: I18NLocaleCode!) {
  featuredPartners: partners(
    locale: $locale
    pagination: { limit: -1 }
    filters: { featured: { eq: true } }
    sort: "priority:asc"
  ) {
    ...PartnerEntity
  }
  notFeaturedPartners: partners(
    locale: $locale
    pagination: { limit: -1 }
    filters: { featured: { eq: false } }
    sort: "priority:asc"
  ) {
    ...PartnerEntity
  }
}

fragment PartnerEntity on Partner {
  documentId
  title
  url
  logo {
    documentId
    url
    alternativeText
  }
  priority
  featured
}
